<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
<meta name="theme-color" content="#064e3b" />
<title>منظومة إدارة المعاملات والطلبات</title>
<meta name="description" content="منظومة ذكية عامة لإدارة وفرز طلبات ومعاملات المواطنين لأي جهة، مع تدقيق المستمسكات بالذكاء الاصطناعي، الباركود، والمراسلة عبر واتساب. تعمل على أي جهاز وتُربط بكوكل سكربت." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ============ نظام التصميم — نفس أسلوب المنظومة (أخضر/رمادي/ذهبي) ============ */
:root{
  --em-950:#022c22; --em-900:#064e3b; --em-800:#065f46; --em-700:#047857; --em-600:#059669; --em-50:#ecfdf5; --em-100:#d1fae5; --em-200:#a7f3d0; --em-300:#6ee7b7;
  --sl-900:#0f172a; --sl-800:#1e293b; --sl-700:#334155; --sl-600:#475569; --sl-500:#64748b; --sl-400:#94a3b8; --sl-300:#cbd5e1; --sl-200:#e2e8f0; --sl-100:#f1f5f9; --sl-50:#f8fafc;
  --am-300:#fcd34d; --am-400:#fbbf24; --am-500:#f59e0b;
  --rose:#e11d48; --red:#dc2626; --red-50:#fef2f2; --red-200:#fecaca; --red-900:#7f1d1d;
  --blue:#2563eb; --amber-50:#fffbeb; --amber-200:#fde68a; --amber-900:#78350f;
  --shadow-xs:0 1px 2px rgba(0,0,0,.05); --shadow:0 1px 3px rgba(0,0,0,.1),0 1px 2px rgba(0,0,0,.06);
  --shadow-lg:0 10px 15px -3px rgba(0,0,0,.1),0 4px 6px -4px rgba(0,0,0,.1); --shadow-2xl:0 25px 50px -12px rgba(0,0,0,.25);
  --r:12px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Cairo','IBM Plex Sans Arabic',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--sl-50);color:var(--sl-900);-webkit-font-smoothing:antialiased;line-height:1.6;font-size:14px}
.mono,.tabular{font-family:'JetBrains Mono',monospace;direction:ltr;unicode-bidi:plaintext}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
a{color:inherit;text-decoration:none}
::selection{background:var(--em-600);color:#fff}
.hidden{display:none !important}
/* layout helpers */
.flex{display:flex}.col{flex-direction:column}.items-center{align-items:center}.justify-between{justify-content:space-between}.justify-center{justify-content:center}.justify-end{justify-content:flex-end}
.gap1{gap:4px}.gap2{gap:8px}.gap3{gap:12px}.gap4{gap:16px}.gap5{gap:20px}.gap6{gap:24px}
.wrap{flex-wrap:wrap}.grow{flex:1}.shrink0{flex-shrink:0}
.grid{display:grid}.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
@media(max-width:860px){.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:1fr}.g2{grid-template-columns:1fr}.hide-sm{display:none}}
@media(min-width:861px){.only-sm{display:none}}
.wrapmax{max-width:1200px;margin:0 auto;width:100%;padding:0 16px}
.txt-xs{font-size:11px}.txt-sm{font-size:12px}.txt-base{font-size:14px}.txt-lg{font-size:16px}.txt-xl{font-size:19px}.txt-2xl{font-size:23px}
.b{font-weight:700}.sb{font-weight:600}.black{font-weight:900}
.muted{color:var(--sl-500)}.muted2{color:var(--sl-400)}
.em{color:var(--em-800)}.center{text-align:center}
.mt1{margin-top:4px}.mt2{margin-top:8px}.mt3{margin-top:12px}.mt4{margin-top:16px}.mb2{margin-bottom:8px}.mb3{margin-bottom:12px}
/* components */
.card{background:#fff;border:1px solid var(--sl-200);border-radius:var(--r);box-shadow:var(--shadow-xs)}
.pad4{padding:16px}.pad5{padding:20px}.pad6{padding:24px}.pad3{padding:12px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 14px;border-radius:10px;font-weight:700;font-size:12px;transition:.15s;white-space:nowrap}
.btn:active{transform:translateY(1px)}
.btn-em{background:var(--em-800);color:#fff}.btn-em:hover{background:var(--em-900)}
.btn-dark{background:var(--sl-900);color:var(--am-300)}.btn-dark:hover{background:var(--sl-800)}
.btn-gray{background:var(--sl-100);color:var(--sl-700);border:1px solid var(--sl-200)}.btn-gray:hover{background:var(--sl-200)}
.btn-white{background:#fff;color:var(--sl-700);border:1px solid var(--sl-300)}.btn-white:hover{background:var(--sl-50)}
.btn-wa{background:#16a34a;color:#fff}.btn-wa:hover{background:#15803d}
.btn-sm{padding:6px 10px;font-size:11px;border-radius:8px}
.ic{width:1em;height:1em;display:inline-block;vertical-align:-.125em;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:700}
input,select,textarea{width:100%;padding:9px 11px;background:var(--sl-50);border:1px solid var(--sl-200);border-radius:10px;outline:none;transition:.15s}
input:focus,select:focus,textarea:focus{background:#fff;border-color:var(--em-600);box-shadow:0 0 0 3px rgba(5,150,105,.15)}
label{display:block;font-weight:700;color:var(--sl-700);margin-bottom:5px;font-size:12px}
.field{margin-bottom:14px}
/* badges for status */
.st{padding:3px 9px;border-radius:999px;font-size:11px;font-weight:700;white-space:nowrap}
.st-recv{background:#dbeafe;color:#1e40af}.st-rev{background:#fef9c3;color:#854d0e}.st-wait{background:#ffedd5;color:#9a3412}
.st-sent{background:var(--em-100);color:var(--em-800)}.st-follow{background:#e0e7ff;color:#3730a3}.st-done{background:#dcfce7;color:#166534}.st-rej{background:#fee2e2;color:#991b1b}
.urg-high{background:#fee2e2;color:#991b1b}.urg-mid{background:#fef9c3;color:#854d0e}.urg-low{background:var(--sl-100);color:var(--sl-600)}
/* modal */
.overlay{position:fixed;inset:0;z-index:60;background:rgba(15,23,42,.6);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding:14px;overflow-y:auto}
.modal{background:#fff;border-radius:16px;box-shadow:var(--shadow-2xl);width:100%;max-height:94vh;display:flex;flex-direction:column;overflow:hidden}
.modal-h{padding:16px 20px;border-bottom:1px solid var(--sl-100);display:flex;align-items:center;justify-content:between;gap:10px}
.modal-b{padding:20px;overflow-y:auto}
.x{padding:6px;border-radius:8px;color:var(--sl-400)}.x:hover{background:var(--sl-100);color:var(--sl-700)}
/* header */
header.top{position:sticky;top:0;z-index:40;background:#fff;border-bottom:1px solid var(--sl-200)}
.seal{width:40px;height:40px;border-radius:9px;overflow:hidden;border:1px solid rgba(6,78,59,.1);background:var(--em-900);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.seal img{width:100%;height:100%;object-fit:cover}
.brandmark{border-radius:10px;background:linear-gradient(135deg,var(--em-800),var(--em-950));color:var(--am-300);display:flex;align-items:center;justify-content:center;flex-shrink:0;border:1px solid rgba(6,78,59,.15)}
.brandmark .ic{width:55%;height:55%;stroke-width:1.8}
.switch{display:flex;padding:4px;background:var(--sl-100);border:1px solid var(--sl-200);border-radius:12px;font-size:12px;font-weight:700}
.switch button{padding:6px 12px;border-radius:8px;color:var(--sl-600);display:flex;align-items:center;gap:6px;white-space:nowrap}
.switch button.on-em{background:var(--em-800);color:#fff}
.switch button.on-dark{background:var(--sl-900);color:var(--am-300)}
.navlink{padding:4px 0;border-bottom:2px solid transparent;color:var(--sl-600);font-weight:600;font-size:12px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.navlink.active{border-color:var(--em-700);color:var(--em-800);font-weight:700}
.dot{width:8px;height:8px;border-radius:999px;background:var(--em-300);display:inline-block}
.bell{position:relative;padding:8px;border-radius:10px;border:1px solid var(--sl-200);background:#fff}
.bell .cnt{position:absolute;top:-6px;left:-6px;background:var(--rose);color:#fff;font-size:10px;font-weight:900;border-radius:999px;padding:1px 5px;border:2px solid #fff}
/* stat cards */
.stat{background:#fff;border:1px solid var(--sl-200);border-radius:var(--r);padding:14px;cursor:pointer;transition:.15s}
.stat:hover{box-shadow:var(--shadow);border-color:var(--em-300)}
.stat.active{border-color:var(--em-600);background:var(--em-50)}
.stat .n{font-size:26px;font-weight:900;font-family:'JetBrains Mono',monospace}
/* table/list rows */
.req-row{background:#fff;border:1px solid var(--sl-200);border-radius:var(--r);padding:14px;transition:.15s}
.req-row:hover{box-shadow:var(--shadow);border-color:var(--sl-300)}
.kv{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px solid var(--sl-100);font-size:12px}
.kv:last-child{border-bottom:none}
/* timeline */
.tl{position:relative;padding-right:22px}
.tl:before{content:'';position:absolute;right:6px;top:4px;bottom:4px;width:2px;background:var(--sl-200)}
.tl-item{position:relative;padding-bottom:16px}
.tl-item:before{content:'';position:absolute;right:-20px;top:3px;width:12px;height:12px;border-radius:999px;background:#fff;border:2px solid var(--sl-300)}
.tl-item.done:before{background:var(--em-600);border-color:var(--em-600)}
.tl-item.current:before{background:var(--am-400);border-color:var(--am-400);box-shadow:0 0 0 4px rgba(251,191,36,.25)}
/* AI assistant */
.fab{position:fixed;bottom:20px;left:20px;z-index:50;width:56px;height:56px;border-radius:999px;background:var(--em-800);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow-lg)}
.fab:hover{background:var(--em-900)}
.ai-panel{position:fixed;bottom:86px;left:20px;z-index:55;width:380px;max-width:calc(100vw - 32px);height:540px;max-height:calc(100vh - 120px);background:#fff;border:1px solid var(--sl-200);border-radius:16px;box-shadow:var(--shadow-2xl);display:flex;flex-direction:column;overflow:hidden}
.ai-head{background:var(--em-950);color:#fff;padding:12px 14px;display:flex;align-items:center;justify-content:space-between}
.ai-msgs{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px;background:var(--sl-50)}
.bubble{max-width:85%;padding:9px 12px;border-radius:14px;font-size:13px;white-space:pre-wrap;line-height:1.7}
.bubble.u{align-self:flex-start;background:var(--em-800);color:#fff;border-bottom-right-radius:4px}
.bubble.a{align-self:flex-end;background:#fff;border:1px solid var(--sl-200);border-bottom-left-radius:4px}
.ai-in{padding:10px;border-top:1px solid var(--sl-200);display:flex;gap:8px;background:#fff}
.ai-in input{border-radius:999px}
.spin{animation:sp 1s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.pulse{animation:pl 1.6s ease-in-out infinite}@keyframes pl{50%{opacity:.5}}
/* barcode */
.barcode-box{background:#fff;padding:12px;border:1px dashed var(--sl-300);border-radius:10px;text-align:center}
.scan-video{width:100%;border-radius:12px;background:#000;max-height:320px;object-fit:cover}
.scan-frame{position:relative}
.scan-line{position:absolute;left:8%;right:8%;height:2px;background:var(--em-400);box-shadow:0 0 8px var(--em-600);top:50%;animation:scanln 2s ease-in-out infinite}
@keyframes scanln{0%,100%{top:20%}50%{top:80%}}
/* banner */
.banner{padding:8px 16px;font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px}
.banner.ok{background:var(--em-900);color:#fff}
.banner.warn{background:var(--amber-50);color:var(--amber-900);border-bottom:1px solid var(--amber-200)}
.banner.off{background:var(--sl-800);color:var(--sl-200)}
footer{background:#fff;border-top:1px solid var(--sl-200);padding:16px;margin-top:auto}
.toast{position:fixed;bottom:20px;right:20px;z-index:80;background:var(--sl-900);color:#fff;padding:12px 16px;border-radius:12px;box-shadow:var(--shadow-lg);font-size:13px;font-weight:600;display:flex;align-items:center;gap:8px;max-width:360px}
/* print */
@media print{
  .no-print{display:none !important}
  body{background:#fff}
  .print-area{box-shadow:none !important;border:none !important}
  @page{margin:14mm}
}
.print-only{display:none}
@media print{.print-only{display:block}}
/* login hero */
.hero{background:linear-gradient(135deg,var(--em-950),var(--em-800));color:#fff}
.input-ic{position:relative}
.input-ic .ic{position:absolute;right:11px;top:50%;transform:translateY(-50%);color:var(--sl-400);pointer-events:none}
.input-ic input{padding-right:34px}
.codebox{background:var(--sl-900);color:#e2e8f0;border-radius:12px;padding:14px;font-family:'JetBrains Mono',monospace;font-size:11px;direction:ltr;text-align:left;overflow-x:auto;max-height:360px;line-height:1.7;white-space:pre}
</style>
</head>

<script>
"use strict";
/* =========================================================================
   منظومة إدارة المعاملات والطلبات · الجهة
   تطبيق ويب مستقل يعمل على أي جهاز · تأليف وإعداد: أ.م. أحمد الربيعي للحلول الهندسية
   ========================================================================= */
const APP = {
  version: '3.5.0',
  name: 'منظومة إدارة المعاملات والطلبات',
  masterWhatsApp: '9647844195061',     // رقم المدير لطلب التفعيل (يُصدر الترخيص من لوحة التحكم الموحّدة)
  office: 'الجهة',                      // اسم الجهة الافتراضي (يُضبط من رابط الترخيص أول مرة فقط)
  brandLine: ''
};
// علامة محايدة بدل الشعار الرسمي (يمكن ضبط شعار الجهة لاحقاً من الترخيص)
function brandMark(sz){ const s=sz||40; if(state.settings&&state.settings.logo){ return `<div class="brandmark" style="width:${s}px;height:${s}px;padding:0;overflow:hidden"><img src="${state.settings.logo}" alt="شعار" style="width:100%;height:100%;object-fit:cover"></div>`; } return `<div class="brandmark" style="width:${s}px;height:${s}px">${icon('building','ic')}</div>`; }
function orgName(){ return state.settings.appName || state.settings.officeName || APP.office; }

/* ---------- أدوات عامة ---------- */
const $ = (s,el=document)=>el.querySelector(s);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const icon = (id,cls='ic')=>`<svg class="${cls}" viewBox="0 0 24 24"><use href="#i-${id}"/></svg>`;
const nowStr = ()=> new Date().toISOString().replace('T',' ').substring(0,16);

const LIC = {
  PROD: 'naib',
  PREFIX: 'NBL1.',
  LSKEY: 'naib-lic2',
  GRACE: 7*864e5,
  // المفتاح العام LIC2 (RSA) — نفس مفتاح بقية برامجك، للتحقق فقط. المفتاح الخاص يبقى في خادمك.
  PUB: {kty:'RSA', e:'AQAB', n:'ransa1_snXCDeB-LCZOVjD8x5ex8OFR8tFUn4x7o-AaxPgw5MRhqOvnDM6t60QnVz70L6_fE9kTevMiVPp7JaVBNRx_d6hyIGK9qFtusEeCDkMbWyKcCcEpvoeZM1RZjdy7ic3Eed1lopwzvYz9rtGAyS7fcn2gbgv5t4D3io64PosROx0Yo6symcZ3dJePX4-meHVmikMHNHUxjbsf76bkcdmrc-JHzqL7ewiPPgL7kp6aQfYiQyS_i2Nw6fNli7scWPexJe0clgtvCebmFXR8TfVJu92Z6-Z5WmVJd0G0ktDHCH4dojouaugEYZxXCzQGbRF5nC9DcPOn3z1RM4Q'},
  _b64uToStr(b){ b=String(b).replace(/-/g,'+').replace(/_/g,'/'); while(b.length%4)b+='='; return decodeURIComponent(escape(atob(b))); },
  async deviceId(){
    let t=null; try{ t=localStorage.getItem('naib-dev'); }catch(e){}
    if(!t){ const a=new Uint8Array(9); crypto.getRandomValues(a); t='B-'+[...a].map(x=>x.toString(16).padStart(2,'0')).join('').toUpperCase(); try{ localStorage.setItem('naib-dev',t); }catch(e){} }
    return t;
  },
  async rid(src){ const e=await crypto.subtle.digest('SHA-256', new TextEncoder().encode('naib-office:'+String(src||'').trim().toLowerCase())); return [...new Uint8Array(e)].slice(0,8).map(a=>a.toString(16).padStart(2,'0')).join('').toUpperCase(); },
  devLabel(){ const os=/Android/i.test(navigator.userAgent)?'Android':/iPhone|iPad/i.test(navigator.userAgent)?'iPhone':'متصفح'; return (os+' · '+(state.settings.officeName||APP.office)).slice(0,60); },
  stored(){ try{ return JSON.parse(localStorage.getItem(this.LSKEY)||'null'); }catch(e){ return null; } },
  save(o){ try{ localStorage.setItem(this.LSKEY, JSON.stringify(o)); }catch(e){} },
  async call(url, body){ const r=await fetch(url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body),redirect:'follow'}); if(!r.ok)throw new Error('HTTP '+r.status); return r.json(); },
  parseLink(t){
    t=String(t||'').trim(); try{ t=decodeURIComponent(t); }catch(e){}
    const m = t.match(/NBL1\.([A-Za-z0-9_\-]+)/) || t.match(/[#&]go=([A-Za-z0-9_\-]{20,})/) || t.match(/^([A-Za-z0-9_\-]{40,})$/);
    if(!m) return null;
    try{ const a=JSON.parse(this._b64uToStr(m[1])); return (a&&a.l&&a.l.k&&a.l.s)?a:null; }catch(e){ return null; }
  },
  async verify(lease){
    try{
      const e=String(lease||'').split('.');
      if(e.length!==3 || e[0]!=='RTL2') return null;
      const key=await crypto.subtle.importKey('jwk', {kty:'RSA', n:this.PUB.n, e:this.PUB.e, alg:'RS256', ext:true}, {name:'RSASSA-PKCS1-v1_5', hash:'SHA-256'}, false, ['verify']);
      const sig=Uint8Array.from(atob(e[2].replace(/-/g,'+').replace(/_/g,'/')+'==='.slice((e[2].length+3)%4)), c=>c.charCodeAt(0));
      const ok=await crypto.subtle.verify('RSASSA-PKCS1-v1_5', key, sig, new TextEncoder().encode(e[1]));
      return ok ? JSON.parse(this._b64uToStr(e[1])) : null;
    }catch(e){ return null; }
  },
  async activate(linkOrCode){
    const e=this.parseLink(linkOrCode);
    if(!e) throw new Error('رابط/رمز التفعيل غير صحيح أو ناقص. انسخه كاملاً من رسالة واتساب.');
    const srv=e.l.s, cloud=(e.c&&e.c.u)||'', fp=await this.deviceId(), rid=await this.rid(cloud||e.l.k);
    const c=await this.call(srv, {act:'lic_activate', key:e.l.k, fp, rid, shop:e.n||'', dev:this.devLabel(), ver:APP.version, os:navigator.platform||'', prod:this.PROD});
    if(!c.ok) throw new Error(c.error||'رُفض التفعيل');
    const p=await this.verify(c.lease);
    if(!p) throw new Error('رد خادم التراخيص غير موقّع بمفتاحك. تأكد أن الرابط من لوحتك.');
    if(p.prod!==this.PROD) throw new Error('هذا الترخيص لبرنامج آخر');
    this.save({lease:c.lease, s:srv, k:e.l.k, rid, cloud, n:e.n||'', w:e.w||'', at:Date.now(), msg:c.msg||''});
    if(cloud && !state.settings.gasUrl){ state.settings.gasUrl=cloud; saveSettings(); }
    if(e.n && (!state.settings.officeName || state.settings.officeName===APP.office)){ state.settings.officeName=e.n; saveSettings(); }
    return await this.evaluate();
  },
  async refresh(force){
    const e=this.stored(); if(!e||!e.k) return;
    if(!force && e.at && (Date.now()-e.at < 6*36e5) && !e.blocked) return;
    try{
      const a=await this.call(e.s, {act:'lic_check', key:e.k, fp:await this.deviceId(), rid:e.rid, ver:APP.version, dev:this.devLabel()});
      if(a.ok && a.status==='active' && a.lease && await this.verify(a.lease)){ Object.assign(e,{lease:a.lease, at:Date.now(), msg:a.msg||''}); delete e.blocked; delete e.blockMsg; this.save(e); }
      else if(a.ok && ['revoked','reset','unknown'].includes(a.status)){ e.blocked = a.status==='reset'?'reset':'suspended'; e.blockMsg=a.msg||''; this.save(e); }
    }catch(err){ /* بلا إنترنت: نعتمد على مهلة السماح */ }
    return await this.evaluate();
  },
  async evaluate(){
    const t=this.stored();
    if(!t||!t.lease) return {state:'none'};
    const p=await this.verify(t.lease);
    if(t.blocked) return {state: t.blocked==='reset'?'reset':'suspended', reason:t.blockMsg, payload:p};
    const fp=await this.deviceId();
    if(!p || p.prod!==this.PROD || (p.fp && p.fp!==fp)) return {state:'invalid', reason: p?(p.fp&&p.fp!==fp?'الترخيص مربوط بجهاز آخر':'الترخيص لبرنامج آخر'):'التوقيع غير صالح'};
    const now=Date.now(), until=p.until || (t.at + 30*864e5);
    if(now < until) return {state:'active', payload:p};
    if(now < until + this.GRACE) return {state:'grace', payload:p, graceLeft: Math.ceil((until+this.GRACE-now)/864e5)};
    return {state:'offline-expired', payload:p};
  }
};

/* ===========================================================================
   مولّد باركود Code128 (نقي بلا مكتبات خارجية) → SVG
   =========================================================================== */
const Barcode = (function(){
  const P = ["11011001100","11001101100","11001100110","10010011000","10010001100","10001001100","10011001000","10011000100","10001100100","11001001000","11001000100","11000100100","10110011100","10011011100","10011001110","10111001100","10011101100","10011100110","11001110010","11001011100","11001001110","11011100100","11001110100","11101101110","11101001100","11100101100","11100100110","11101100100","11100110100","11100110010","11011011000","11011000110","11000110110","10100011000","10001011000","10001000110","10110001000","10001101000","10001100010","11010001000","11000101000","11000100010","10110111000","10110001110","10001101110","10111011000","10111000110","10001110110","11101110110","11010001110","11000101110","11011101000","11011100010","11011101110","11101011000","11101000110","11100010110","11101101000","11101100010","11100011010","11101111010","11001000010","11110001010","10100110000","10100001100","10010110000","10010000110","10000101100","10000100110","10110010000","10110000100","10011010000","10011000010","10000110100","10000110010","11000010010","11001010000","11110111010","11000010100","10001111010","10100111100","10010111100","10010011110","10111100100","10011110100","10011110010","11110100100","11110010100","11110010010","11011011110","11011110110","11110110110","10101111000","10100011110","10001011110","10111101000","10111100010","11110101000","11110100010","10111011110","10111101110","11101011110","11110101110","11010000100","11010010000","11010011100","11000111010"];
  const START_B=104, STOP=106;
  return function(text){
    text = String(text||'');
    let codes=[START_B], sum=START_B;
    for(let i=0;i<text.length;i++){ let v=text.charCodeAt(i)-32; if(v<0||v>94)v=0; codes.push(v); sum+=v*(i+1); }
    codes.push(sum%103); codes.push(STOP);
    let bits=''; codes.forEach(c=>bits+=P[c]); bits+='11';
    const h=56, qz=10; let x=qz, rects='';
    for(let i=0;i<bits.length;){ let j=i; while(j<bits.length&&bits[j]===bits[i])j++; const w=j-i; if(bits[i]==='1')rects+=`<rect x="${x}" y="0" width="${w}" height="${h}" fill="#000"/>`; x+=w; i=j; }
    const total=x+qz;
    return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${total} ${h+18}" width="100%" style="max-width:320px"><rect width="${total}" height="${h+18}" fill="#fff"/>${rects}<text x="${total/2}" y="${h+14}" text-anchor="middle" font-family="JetBrains Mono,monospace" font-size="12" fill="#000">${esc(text)}</text></svg>`;
  };
})();

  upsert(req){ const i=state.requests.findIndex(r=>r.id===req.id||r.trackingId===req.trackingId); if(i>=0)state.requests[i]=req; else state.requests.unshift(req); this.persist(); if(!state.public && state.settings.gasUrl) GAS.push(); },

  newTracking(){ let n=0; state.requests.forEach(r=>{ const m=/CIT-2026-(\d+)/.exec(r.trackingId||''); if(m) n=Math.max(n, parseInt(m[1],10)); }); return 'CIT-2026-'+String(n+1).padStart(6,'0'); },
  importRestore(obj, mode){ // mode: 'replace' | 'merge'
    let arr = Array.isArray(obj)?obj:(obj&&obj.requests)||[]; arr=arr.filter(r=>r&&r.trackingId);
    if(!arr.length) return 0;
    if(mode==='merge'){ const byId={}; state.requests.forEach(r=>byId[r.trackingId]=r); arr.forEach(r=>byId[r.trackingId]=r); state.requests=Object.values(byId); }
    else state.requests=arr;
    this.sortRecent(); this.persist(); return arr.length;
  },
  exportBackup(){ return JSON.stringify({app:'naib',type:'backup',version:APP.version,exportedAt:nowStr(),count:state.requests.length,requests:state.requests}); }
};

const GAS = {
  async push(){
    if(!state.settings.gasUrl||!state.online) return {ok:false};
    try{
      const res = await fetch(state.settings.gasUrl, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify({action:'SYNC_ALL', requests: state.requests}) });
      const data = await res.json().catch(()=>({}));
      return {ok:true, data};
    }catch(e){ return {ok:false, error:e.message}; }
  },
  async pull(){
    if(!state.settings.gasUrl||!state.online) return {ok:false};
    try{
      const res = await fetch(state.settings.gasUrl+'?action=FETCH_ALL', { method:'GET' });
      const data = await res.json();
      if(data && Array.isArray(data.requests) && data.requests.length){
        const incoming = data.requests.map(r=> r.payload ? JSON.parse(r.payload) : r).filter(r=>r&&r.trackingId);
        if(incoming.length){ state.requests = incoming; Store.sortRecent(); Store.persist(); }
      }
      if(data && data.meta){ try{ applyMeta(typeof data.meta==='string'?JSON.parse(data.meta):data.meta); }catch(e){} }

/* ===========================================================================
   التدقيق الذكي البديل (يعمل بلا إنترنت) — مطابق لمنطق المنظومة
   =========================================================================== */
function heuristicAudit(category, title, description, docs){
  const missing=[]; const lower=((title||'')+' '+(description||''));
  const has = kw => docs.some(d=> (d.name||'').includes(kw));
  if(/رعاية|اجتماعي/.test(category)){
    if(!(has('تقرير')||has('عجز')||has('طبي'))) missing.push('تقرير اللجنة الطبية الاستشارية لبيان نسبة العجز (صادر من دائرة الصحة)');
    if(!(has('تقاعد')||has('راتب'))) missing.push('تأييد عدم وجود راتب تقاعدي صادر من هيئة التقاعد الوطنية / منصة أور');
    if(!has('سكن')) missing.push('بطاقة السكن المحدثة مصدقة من مكتب المعلومات');
  } else if(/علاج|صحة/.test(category)){
    if(!(has('إخلاء')||has('مركزية'))) missing.push('قرار اللجنة الطبية الاستشارية المركزية للإخلاء والاستقدام الطبي');
    if(!has('جواز')) missing.push('جواز سفر نافذ للمريض والمرافق');
  } else if(/شهداء|جرحى/.test(category)){
    if(!(has('قسام')||has('إرث'))) missing.push('قسام شرعي حديث مصدق من محكمة الأحوال الشخصية');
    if(!(has('قرار')||has('مؤسسة'))) missing.push('قرار لجنة المصادقة النهائي الصادر من مؤسسة الشهداء');
  } else if(/أرض|إعمار|بلدي/.test(category)){
    if(!(has('سكن')||has('تأييد'))) missing.push('تأييد البلدية بعدم استلام قطعة أرض سابقاً');
  }
  if(!(has('وطنية')||has('هوية')||has('موحدة'))) missing.push('البطاقة الوطنية الموحدة (وجه وظهر واضحة)');
  const completeness = Math.max(20, Math.min(100, Math.round(100 - missing.length*25)));
  return {
    summary:`تم تدقيق المعاملة وفق الضوابط والتعليمات الوزارية النافذة لسنة 2026. الحالة: ${completeness>=80?'جاهزة للإحالة':'تحتاج استكمال مستمسكات'}.`,
    completenessRate: completeness, missingDocsSummary: missing,
    priorityReason: /عاجل|طفل|وفاة|عجز/.test(lower)?'حالة إنسانية ملحة تتطلب تدخلاً سريعاً':'إجراءات معاملة إدارية روتينية',
    suggestedAction: missing.length?'مراسلة المواطن عبر واتساب لتزويدنا بالمستمسكات الناقصة فوراً':'إصدار كتاب رسمي وتوقيعه من الجهة المختصة وإحالته للجهة المعنية',
    targetDirectorate: /رعاية/.test(category)?'هيئة الحماية الاجتماعية / وزارة العمل': /صحة/.test(category)?'دائرة العمليات والخدمات الطبية / وزارة الصحة': /شهداء/.test(category)?'مؤسسة الشهداء':'الجهة المعنية ذات الاختصاص'
  };
}
function slaInfo(submittedAt, status){
  const done = status==='منجز'||status==='معتذر عنه'||status==='خارج الاختصاص — إرشاد';
  const d = new Date((submittedAt||'').replace(' ','T')); const days = Math.floor((Date.now()-d.getTime())/864e5);
  return { days: isNaN(days)?0:days, isOverdue: !done && days>7 };
}
function overdueCount(){ return state.requests.filter(r=>slaInfo(r.submittedAt,r.status).isOverdue).length; }

/* ===========================================================================
   طبقة الذكاء الاصطناعي (Gemini / Claude) — مساعد يبحث ويفرز وينفّذ الأوامر
   =========================================================================== */
const AI = {
  ready(){ const s=state.settings; return s.aiProvider==='gemini' ? !!s.geminiKey : !!s.claudeKey; },
  dataSnapshot(){
    return state.requests.slice(0,400).map(r=>({ رمز:r.trackingId, مواطن:r.citizenName, هاتف:r.phone, محافظة:r.governorate, قضاء:r.district, نوع:r.requestType, جهة:r.targetEntity, طلب:r.title, حالة:r.status, أولوية:r.urgency, نطاق:r.scope, مكتب:r.office, موظف:r.receptionEmployee, تقديم:r.submittedAt }));
  },
  systemPrompt(){
    return `أنت "مساعد إدارة المعاملات" الذكي داخل منظومة إدارة المعاملات والطلبات. مهمتك مساعدة الموظف في البحث والفرز وتحليل طلبات المواطنين وتنفيذ الأوامر داخل البرنامج.
لديك بيانات المعاملات التالية (JSON): ${JSON.stringify(this.dataSnapshot())}
أجب دائماً باللغة العربية وبشكل موجز ومهني.
عندما يطلب المستخدم إجراءً داخل البرنامج، أعد في نهاية ردك كتلة أوامر JSON بين وسمين <ACT> و </ACT> تحتوي مصفوفة "actions". الأنواع المدعومة:
- {"type":"filter","status":"...","governorate":"...","urgency":"عاجل|عالٍ|متوسط|اعتيادي","requestType":"...","q":"نص بحث"} لفرز وعرض الطلبات (استخدم القيم الموجودة فعلاً).
- {"type":"sort","by":"urgency|date|status"} لترتيب القائمة.
- {"type":"open","trackingId":"CIT-2026-XXXXXX"} لفتح تفاصيل طلب.
- {"type":"draft_whatsapp","trackingId":"...","kind":"missing_docs|status|approved"} لتوليد رسالة واتساب.
- {"type":"draft_letter","trackingId":"..."} لتوليد كتاب رسمي.
- {"type":"audit","trackingId":"..."} لإعادة تدقيق المستمسكات.
- {"type":"goto","tab":"dashboard|secretary-quick"} للتنقل.
لا تضع كتلة <ACT> إلا عند الحاجة لإجراء فعلي. لا تختلق بيانات غير موجودة.`;
  },
  async ask(messages){
    const s=state.settings;
    if(s.aiProvider==='claude') return this._claude(messages);
    return this._gemini(messages);
  },
  // المفاتيح الجديدة AQ. والقديمة AIza تعمل عبر ترويسة x-goog-api-key
  geminiAuthHeaders(extra){ return Object.assign({'x-goog-api-key':(state.settings.geminiKey||'').trim()}, extra||{}); },
  _modelVer(n){ const m=String(n).match(/gemini-(\d+(?:\.\d+)?)/); return m?parseFloat(m[1]):0; },
  // يجلب النماذج الفعلية المتاحة لمفتاحك (تشمل أي نماذج جديدة مثل gemini-3)
  async geminiListModels(){
    const res=await fetch('https://generativelanguage.googleapis.com/v1beta/models',{ headers:this.geminiAuthHeaders() });
    if(!res.ok){ const t=await res.text(); throw new Error('Gemini '+res.status+': '+t.slice(0,160)); }
    const d=await res.json();
    return (d.models||[]).filter(m=>(m.supportedGenerationMethods||[]).includes('generateContent'))
      .map(m=>String(m.name).replace('models/',''))
      .filter(n=>/gemini/i.test(n) && !/(embedding|aqa|imagen|image|tts|audio|live|vision$|learnlm)/i.test(n));
  },
  // يختار أفضل نموذج محادثة (يفضّل flash الأحدث)
  pickGeminiModel(models){
    const alias=['gemini-flash-latest','gemini-flash-lite-latest'];
    for(const a of alias){ if(models.includes(a)) return a; }
    const flash=models.filter(n=>/flash/i.test(n)&&!/thinking|exp|lite/i.test(n)).sort((a,b)=>this._modelVer(b)-this._modelVer(a));
    if(flash.length) return flash[0];
    const anyFlash=models.filter(n=>/flash/i.test(n)).sort((a,b)=>this._modelVer(b)-this._modelVer(a));
    if(anyFlash.length) return anyFlash[0];
    const proLatest=models.filter(n=>/pro/i.test(n)).sort((a,b)=>this._modelVer(b)-this._modelVer(a));
    return proLatest[0]||models[0];
  },
  async _buildGeminiTryList(){
    const s=state.settings; const list=[];
    if(s.geminiModel) list.push(s.geminiModel);
    try{
      const avail=await this.geminiListModels();
      if(avail.length){
        const best=this.pickGeminiModel(avail); if(!list.includes(best)) list.push(best);
        avail.filter(n=>/flash/i.test(n)).sort((a,b)=>this._modelVer(b)-this._modelVer(a)).slice(0,4).forEach(n=>{ if(!list.includes(n)) list.push(n); });
      }
    }catch(e){ if(/\b(401|403)\b/.test(e.message)) throw new Error('المفتاح مرفوض ('+e.message+') — تأكد من نسخه كاملاً'); }
    ['gemini-flash-latest','gemini-2.5-flash'].forEach(n=>{ if(!list.includes(n)) list.push(n); });
    return list;
  },
  async _gemini(messages){
    const s=state.settings;
    const contents = messages.map(m=>({ role: m.role==='assistant'?'model':'user', parts:[{text:m.content}] }));
    const body = JSON.stringify({ system_instruction:{parts:[{text:this.systemPrompt()}]}, contents, generationConfig:{temperature:0.4} });
    const sleep=ms=>new Promise(r=>setTimeout(r,ms));
    const models=await this._buildGeminiTryList(); let lastErr='تعذّر الاتصال بأي نموذج';
    for(const model of models){
      for(let attempt=0; attempt<2; attempt++){
        let res;
        try{
          const url = `https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent`;
          res = await fetch(url, { method:'POST', headers:this.geminiAuthHeaders({'Content-Type':'application/json'}), body });
        }catch(e){ lastErr='تعذّر الوصول للشبكة: '+e.message; break; }
        if(res.status===503||res.status===429){ lastErr=`النموذج ${model} مزدحم حالياً (${res.status})`; await sleep(1200*(attempt+1)); continue; }
        if(res.status===404){ lastErr=`النموذج ${model} غير متاح لمفتاحك (404)`; break; }
        if(res.status===400||res.status===401||res.status===403){ const t=await res.text(); throw new Error(`مشكلة في المفتاح أو الطلب (${res.status}): `+t.slice(0,150)); }
        if(!res.ok){ const t=await res.text(); lastErr='Gemini '+res.status+': '+t.slice(0,150); break; }
        const d=await res.json();
        if(model!==s.geminiModel){ state.settings.geminiModel=model; saveSettings(); }
        return (d.candidates&&d.candidates[0]&&d.candidates[0].content&&d.candidates[0].content.parts||[]).map(p=>p.text||'').join('') || 'لا يوجد رد.';
      }
    }
    throw new Error(lastErr+'. إن تكرر 503 فهو ازدحام مؤقت من جوجل على الطبقة المجانية — أعد المحاولة بعد قليل.');
  },
  async _claude(messages){
    const s=state.settings;
    const res = await fetch('https://api.anthropic.com/v1/messages', { method:'POST', headers:{'Content-Type':'application/json','x-api-key':s.claudeKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'}, body: JSON.stringify({ model:s.claudeModel||'claude-sonnet-4-5', max_tokens:1024, system:this.systemPrompt(), messages: messages.map(m=>({role:m.role==='assistant'?'assistant':'user', content:m.content})) }) });
    if(!res.ok){ const t=await res.text(); throw new Error('Claude: '+res.status+' '+t.slice(0,180)); }
    const d = await res.json();
    return (d.content||[]).map(b=>b.text||'').join('') || 'لا يوجد رد.';
  },
  parseActions(text){
    const m = text.match(/<ACT>([\s\S]*?)<\/ACT>/);
    let clean = text.replace(/<ACT>[\s\S]*?<\/ACT>/,'').trim();
    let actions=[];
    if(m){ try{ const o=JSON.parse(m[1].trim()); actions = o.actions||o; if(!Array.isArray(actions))actions=[actions]; }catch(e){} }
    return { text:clean, actions };
  }
};

const GAS_CODE = "/**\n * Code.gs \u2014 \u062e\u0644\u0641\u064a\u0629 \u0643\u0648\u0643\u0644 \u0633\u0643\u0631\u0628\u062a \u0644\u0645\u0646\u0638\u0648\u0645\u0629 \u0627\u0644\u0646\u0627\u0626\u0628 \u00b7 \u0645\u0643\u062a\u0628 \u0634\u0624\u0648\u0646 \u0627\u0644\u0645\u0648\u0627\u0637\u0646\u064a\u0646\n * \u0645\u062c\u0644\u0633 \u0627\u0644\u0646\u0648\u0627\u0628 \u0627\u0644\u0639\u0631\u0627\u0642\u064a \u2014 \u0625\u0639\u062f\u0627\u062f: \u0623.\u0645. \u0623\u062d\u0645\u062f \u0627\u0644\u0631\u0628\u064a\u0639\u064a \u0644\u0644\u062d\u0644\u0648\u0644 \u0627\u0644\u0647\u0646\u062f\u0633\u064a\u0629\n *\n * \u0627\u0644\u0648\u0638\u064a\u0641\u0629: \u062a\u062e\u0632\u064a\u0646 \u0648\u0645\u0632\u0627\u0645\u0646\u0629 \u0637\u0644\u0628\u0627\u062a \u0627\u0644\u0645\u0648\u0627\u0637\u0646\u064a\u0646 \u0641\u064a Google Sheets (\u064a\u0639\u0645\u0644 \u0643\u0642\u0627\u0639\u062f\u0629 \u0628\u064a\u0627\u0646\u0627\u062a \u0633\u062d\u0627\u0628\u064a\u0629).\n * - doPost  : \u0627\u0633\u062a\u0642\u0628\u0627\u0644 \u0627\u0644\u0628\u064a\u0627\u0646\u0627\u062a \u0645\u0646 \u0627\u0644\u062a\u0637\u0628\u064a\u0642 (SYNC_ALL / SAVE_REQUEST).\n * - doGet   : \u0625\u0631\u062c\u0627\u0639 \u0643\u0644 \u0627\u0644\u0637\u0644\u0628\u0627\u062a \u0644\u0644\u062a\u0637\u0628\u064a\u0642 (FETCH_ALL).\n * - \u064a\u062e\u0632\u0651\u0646 \u0627\u0644\u0623\u0639\u0645\u062f\u0629 \u0627\u0644\u0645\u0642\u0631\u0648\u0621\u0629 + \u0639\u0645\u0648\u062f JSON \u0643\u0627\u0645\u0644 (col 17) \u0644\u0644\u062d\u0641\u0627\u0638 \u0639\u0644\u0649 \u0643\u0644 \u0627\u0644\u062a\u0641\u0627\u0635\u064a\u0644.\n * - \u0648\u0631\u0642\u0629 \"\u0627\u0644\u062a\u0631\u0627\u062e\u064a\u0635\" \u0644\u062a\u0633\u062c\u064a\u0644 \u0627\u0644\u0623\u062c\u0647\u0632\u0629 \u0627\u0644\u0645\u0641\u0639\u0651\u0644\u0629 (\u062a\u062d\u0643\u0651\u0645 \u0645\u0631\u0643\u0632\u064a \u0627\u062e\u062a\u064a\u0627\u0631\u064a).\n *\n * \u062e\u0637\u0648\u0627\u062a \u0627\u0644\u0646\u0634\u0631:\n * 1) sheets.google.com \u2190 \u062c\u062f\u0648\u0644 \u062c\u062f\u064a\u062f.\n * 2) \u0627\u0644\u0625\u0636\u0627\u0641\u0627\u062a (Extensions) \u2190 Apps Script\u060c \u0627\u0644\u0635\u0642 \u0647\u0630\u0627 \u0627\u0644\u0643\u0648\u062f\u060c \u0627\u062d\u0641\u0638.\n * 3) Deploy \u2190 New deployment \u2190 Web app \u2190 Who has access: Anyone.\n * 4) \u0627\u0646\u0633\u062e \u0631\u0627\u0628\u0637 (Web App URL) \u0648\u0636\u0639\u0647 \u0641\u064a \u0625\u0639\u062f\u0627\u062f\u0627\u062a \u0627\u0644\u062a\u0637\u0628\u064a\u0642.\n */\n\nvar SHEET_NAME = \"\u0637\u0644\u0628\u0627\u062a_\u0627\u0644\u0645\u0648\u0627\u0637\u0646\u064a\u0646\";\nvar LIC_SHEET  = \"\u0627\u0644\u062a\u0631\u0627\u062e\u064a\u0635\";\nvar META_SHEET = \"\u0627\u0644\u0647\u0648\u064a\u0629_\u0648\u0627\u0644\u062a\u0639\u0644\u064a\u0645\u0627\u062a\";   // \u0627\u0644\u0647\u0648\u064a\u0629 \u0648\u0627\u0644\u0634\u0639\u0627\u0631 \u0648\u0627\u0644\u063a\u0644\u0627\u0641 \u0648\u062a\u0639\u0644\u064a\u0645\u0627\u062a \u0627\u0644\u0645\u0648\u0627\u0637\u0646 (\u0645\u062e\u0632\u0651\u0646\u0629 \u0645\u062c\u0632\u0651\u0623\u0629)\nvar STAFF_SHEET = \"\u0627\u0644\u0645\u0648\u0638\u0641\u0648\u0646_\u0627\u0644\u0641\u0631\u0648\u0639\";     // \u062d\u0633\u0627\u0628\u0627\u062a \u0627\u0644\u0645\u0648\u0638\u0641\u064a\u0646 \u0648\u0627\u0644\u0641\u0631\u0648\u0639 (\u0645\u062e\u0632\u0651\u0646\u0629 \u0645\u062c\u0632\u0651\u0623\u0629)\nvar META_CHUNK = 45000;\n\nfunction saveChunked_(name, str){\n  var ss = SpreadsheetApp.getActiveSpreadsheet();\n  var sh = ss.getSheetByName(name) || ss.insertSheet(name);\n  sh.clearContents();\n  var parts = [];\n  for (var i=0; i<str.length; i+=META_CHUNK) parts.push([str.substring(i, i+META_CHUNK)]);\n  if (parts.length) sh.getRange(1,1,parts.length,1).setValues(parts);\n  return \"ok\";\n}\nfunction getChunked_(name){\n  var ss = SpreadsheetApp.getActiveSpreadsheet();\n  var sh = ss.getSheetByName(name);\n  if (!sh || sh.getLastRow() < 1) return \"\";\n  var vals = sh.getRange(1,1,sh.getLastRow(),1).getValues();\n  return vals.map(function(r){ return r[0]; }).join(\"\");\n}\nfunction saveMeta_(s){ return saveChunked_(META_SHEET, s); }\nfunction getMeta_(){ return getChunked_(META_SHEET); }\nfunction saveStaff_(s){ return saveChunked_(STAFF_SHEET, s); }\nfunction getStaff_(){ return getChunked_(STAFF_SHEET); }\nvar HEADERS = [\n  \"\u0631\u0645\u0632 \u0627\u0644\u062a\u062a\u0628\u0639\",\"\u0627\u0633\u0645 \u0627\u0644\u0645\u0648\u0627\u0637\u0646\",\"\u0631\u0642\u0645 \u0627\u0644\u0647\u0627\u062a\u0641\",\"\u0627\u0644\u0645\u062d\u0627\u0641\u0638\u0629\",\"\u0627\u0644\u0642\u0636\u0627\u0621/\u0627\u0644\u0645\u062d\u0644\u0629\",\"\u0627\u0644\u0642\u0637\u0627\u0639\",\n  \"\u0627\u0644\u0648\u0632\u0627\u0631\u0629 \u0627\u0644\u0645\u0639\u0646\u064a\u0629\",\"\u0639\u0646\u0648\u0627\u0646 \u0627\u0644\u0637\u0644\u0628\",\"\u0627\u0644\u062d\u0627\u0644\u0629 \u0627\u0644\u062d\u0627\u0644\u064a\u0629\",\"\u062f\u0631\u062c\u0629 \u0627\u0644\u0623\u0633\u0628\u0642\u064a\u0629\",\"\u0627\u0644\u0645\u0633\u062a\u0645\u0633\u0643\u0627\u062a \u0627\u0644\u0646\u0627\u0642\u0635\u0629\",\n  \"\u0631\u0642\u0645 \u0627\u0644\u0643\u062a\u0627\u0628 \u0627\u0644\u0646\u064a\u0627\u0628\u064a\",\"\u062a\u0627\u0631\u064a\u062e \u0627\u0644\u0643\u062a\u0627\u0628\",\"\u062a\u0627\u0631\u064a\u062e \u0627\u0644\u062a\u0642\u062f\u064a\u0645\",\"\u0622\u062e\u0631 \u062a\u062d\u062f\u064a\u062b\",\"\u0645\u0644\u0627\u062d\u0638\u0627\u062a \u0627\u0644\u0645\u0643\u062a\u0628\",\"JSON_DATA\"\n];\n\nfunction setupSheet() {\n  var ss = SpreadsheetApp.getActiveSpreadsheet();\n  var sheet = ss.getSheetByName(SHEET_NAME);\n  if (!sheet) sheet = ss.insertSheet(SHEET_NAME);\n  sheet.getRange(1, 1, 1, HEADERS.length).setValues([HEADERS]);\n  sheet.getRange(1, 1, 1, HEADERS.length)\n    .setBackground(\"#064e3b\").setFontColor(\"#ffffff\").setFontWeight(\"bold\").setHorizontalAlignment(\"center\");\n  sheet.setFrozenRows(1);\n  // \u0625\u062e\u0641\u0627\u0621 \u0639\u0645\u0648\u062f JSON\n  sheet.hideColumns(17);\n\n  var lic = ss.getSheetByName(LIC_SHEET);\n  if (!lic) {\n    lic = ss.insertSheet(LIC_SHEET);\n    lic.getRange(1,1,1,5).setValues([[\"\u0631\u0645\u0632 \u0627\u0644\u062c\u0647\u0627\u0632\",\"\u0627\u0633\u0645 \u0627\u0644\u0645\u0643\u062a\u0628/\u0627\u0644\u0645\u0648\u0638\u0641\",\"\u0627\u0644\u062f\u0648\u0631\",\"\u062a\u0627\u0631\u064a\u062e \u0627\u0644\u062a\u0641\u0639\u064a\u0644\",\"\u0627\u0644\u062d\u0627\u0644\u0629\"]]);\n    lic.getRange(1,1,1,5).setBackground(\"#0f172a\").setFontColor(\"#fcd34d\").setFontWeight(\"bold\");\n    lic.setFrozenRows(1);\n  }\n  return \"\u062a\u0645 \u0625\u0639\u062f\u0627\u062f \u0627\u0644\u062c\u062f\u0627\u0648\u0644 \u0628\u0646\u062c\u0627\u062d\";\n}\n\nfunction rowFromRequest(r) {\n  var missing = (r.aiAnalysis && r.aiAnalysis.missingDocsSummary) ? r.aiAnalysis.missingDocsSummary.join(\"\u060c \") : \"\";\n  return [\n    r.trackingId||\"\", r.citizenName||\"\", r.phone||\"\", r.governorate||\"\", r.district||\"\", r.category||\"\",\n    r.targetMinistry||\"\", r.title||\"\", r.status||\"\", r.urgency||\"\", missing,\n    r.officialLetterNumber||\"\", r.officialLetterDate||\"\", r.submittedAt||\"\", r.updatedAt||\"\", r.staffNotes||\"\",\n    JSON.stringify(r)\n  ];\n}\n\nfunction doPost(e) {\n  var lock = LockService.getScriptLock();\n  try {\n    lock.waitLock(20000);\n    var data = JSON.parse(e.postData.contents);\n    var ss = SpreadsheetApp.getActiveSpreadsheet();\n    var sheet = ss.getSheetByName(SHEET_NAME);\n    if (!sheet) { setupSheet(); sheet = ss.getSheetByName(SHEET_NAME); }\n\n    if (data.action === \"SYNC_ALL\" && Array.isArray(data.requests)) {\n      var last = sheet.getLastRow();\n      if (last > 1) sheet.getRange(2, 1, last - 1, HEADERS.length).clearContent();\n      var rows = data.requests.map(rowFromRequest);\n      if (rows.length) sheet.getRange(2, 1, rows.length, HEADERS.length).setValues(rows);\n      return out({ status:\"success\", message:\"\u062a\u0645\u062a \u0645\u0632\u0627\u0645\u0646\u0629 \"+rows.length+\" \u0645\u0639\u0627\u0645\u0644\u0629\", syncedCount: rows.length });\n    }\n\n    if (data.action === \"SAVE_REQUEST\" && data.request) {\n      var r = data.request, foundRow = -1, last = sheet.getLastRow();\n      if (last > 1) {\n        var ids = sheet.getRange(2, 1, last - 1, 1).getValues();\n        for (var i = 0; i < ids.length; i++) if (ids[i][0] === r.trackingId) { foundRow = i + 2; break; }\n      }\n      var row = rowFromRequest(r);\n      if (foundRow > 0) sheet.getRange(foundRow, 1, 1, HEADERS.length).setValues([row]);\n      else sheet.appendRow(row);\n      return out({ status:\"success\", message:\"\u062a\u0645 \u062d\u0641\u0638 \u0627\u0644\u0637\u0644\u0628\", trackingId: r.trackingId });\n    }\n\n    if (data.action === \"REGISTER_LICENSE\" && data.device) {\n      var lic = ss.getSheetByName(LIC_SHEET) || (setupSheet(), ss.getSheetByName(LIC_SHEET));\n      lic.appendRow([data.device, data.office||\"\", data.role||\"\", new Date().toISOString(), \"\u0645\u0641\u0639\u0651\u0644\"]);\n      return out({ status:\"success\", message:\"\u062a\u0645 \u062a\u0633\u062c\u064a\u0644 \u0627\u0644\u062c\u0647\u0627\u0632\" });\n    }\n\n    if (data.action === \"SAVE_META\" && typeof data.meta === \"string\") {\n      saveMeta_(data.meta);\n      return out({ status:\"success\", message:\"\u062a\u0645 \u062d\u0641\u0638 \u0627\u0644\u0647\u0648\u064a\u0629 \u0648\u0627\u0644\u062a\u0639\u0644\u064a\u0645\u0627\u062a\" });\n    }\n\n    if (data.action === \"SAVE_STAFF\" && typeof data.staff === \"string\") {\n      saveStaff_(data.staff);\n      return out({ status:\"success\", message:\"\u062a\u0645 \u062d\u0641\u0638 \u062d\u0633\u0627\u0628\u0627\u062a \u0627\u0644\u0645\u0648\u0638\u0641\u064a\u0646\" });\n    }\n\n    return out({ status:\"error\", message:\"\u0625\u062c\u0631\u0627\u0621 \u063a\u064a\u0631 \u0645\u0639\u0631\u0648\u0641\" });\n  } catch (err) {\n    return out({ status:\"error\", message: String(err) });\n  } finally {\n    lock.releaseLock();\n  }\n}\n\nfunction doGet(e) {\n  var action = (e && e.parameter && e.parameter.action) || \"FETCH_ALL\";\n  var ss = SpreadsheetApp.getActiveSpreadsheet();\n  var sheet = ss.getSheetByName(SHEET_NAME);\n  if (!sheet) { setupSheet(); sheet = ss.getSheetByName(SHEET_NAME); }\n\n  if (action === \"CHECK_LICENSE\") {\n    var dc = e.parameter.device || \"\";\n    var lic = ss.getSheetByName(LIC_SHEET);\n    var status = \"unknown\";\n    if (lic && lic.getLastRow() > 1) {\n      var vals = lic.getRange(2,1,lic.getLastRow()-1,5).getValues();\n      for (var i=0;i<vals.length;i++) if (vals[i][0]===dc) status = String(vals[i][4]||\"\u0645\u0641\u0639\u0651\u0644\");\n    }\n    return out({ status:\"success\", device:dc, licenseStatus:status });\n  }\n\n  if (action === \"GET_META\") {\n    return out({ status:\"success\", meta: getMeta_() });\n  }\n\n  if (action === \"GET_STAFF\") {\n    return out({ status:\"success\", staff: getStaff_() });\n  }\n\n  var last = sheet.getLastRow();\n  if (last <= 1) return out({ requests: [], meta: getMeta_() });\n  var data = sheet.getRange(2, 1, last - 1, HEADERS.length).getValues();\n  var requests = data.map(function(row) {\n    var json = row[16];\n    if (json) { try { return { payload: json }; } catch(x){} }\n    return {\n      trackingId: row[0], citizenName: row[1], phone: row[2], governorate: row[3], district: row[4],\n      category: row[5], targetMinistry: row[6], title: row[7], status: row[8], urgency: row[9],\n      missingDocs: row[10], officialLetterNumber: row[11], officialLetterDate: row[12],\n      submittedAt: row[13], updatedAt: row[14], staffNotes: row[15]\n    };\n  });\n  return out({ requests: requests, meta: getMeta_() });\n}\n\nfunction out(obj) {\n  return ContentService.createTextOutput(JSON.stringify(obj)).setMimeType(ContentService.MimeType.JSON);\n}\n";

async function renderActivation(ev){

  const officeDefault = state.settings.officeName || APP.office;
  $('#app').innerHTML = `
  <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px" class="hero">

        <div class="txt-sm" style="color:var(--em-200);margin-top:4px">الجهة · تفعيل الترخيص السحابي</div>
      </div>
      <div class="pad5">
        ${reason?`<div class="chip urg-high" style="width:100%;justify-content:center;padding:8px;margin-bottom:12px">${icon('alert')} ${esc(reason)}</div>`:''}
        <p class="txt-sm muted mb3" style="line-height:1.8">فعّل البرنامج عبر <b>رابط التفعيل</b> الذي يصلك على واتساب من الإدارة. يكفي لصق الرابط كاملاً هنا، أو افتح الرابط مباشرة فيُفعّل تلقائياً.</p>
        <div class="field">
          <label>رابط / رمز التفعيل (من رسالة واتساب)</label>
          <textarea id="actKey" rows="3" class="mono txt-xs" placeholder="https://…/#go=NBL1.…  أو  NBL1.…"></textarea>
        </div>
        <button class="btn btn-em" style="width:100%;justify-content:center;padding:11px;margin-bottom:12px" id="actApply">${icon('key')} تفعيل هذا الجهاز الآن</button>
        <div class="field">
          <label>اسم الجهة (لطلب الترخيص)</label>
          <input id="actOffice" value="${esc(officeDefault)}" placeholder="مثال: اسم الجهة / الدائرة">
        </div>
        <div class="flex gap2" style="margin-bottom:6px">
          <input class="mono txt-xs" id="actDev" value="${dc}" readonly title="رمز هذا الجهاز">
          <button class="btn btn-gray shrink0" onclick="navigator.clipboard.writeText('${dc}');toast('نُسخ رمز الجهاز')">${icon('copy')}</button>
        </div>
        <button class="btn btn-wa" style="width:100%;justify-content:center;padding:11px" id="actWa">${icon('wa')} طلب الترخيص من الإدارة عبر واتساب</button>
        <div class="center mt4 txt-xs muted2">الإصدار ${APP.version}</div>
        <p class="center txt-xs muted2 mt2" style="line-height:1.7">الترخيص سحابي: يعمل بدون إنترنت 30 يوماً ثم 7 أيام سماح، ويتجدد تلقائياً. تُدار كل التراخيص من لوحة التحكم الموحّدة.</p>
      </div>

    window.open(waLink(APP.masterWhatsApp, msg),'_blank');
  };

    const val = $('#actKey').value.trim();

  };

function filtered(){
  const f=state.filters; const se=state.session;
  return state.requests.filter(r=>{
    if(se && !se.master && se.perms && !se.perms.allBranches && se.branchName){ if((r.office||'')!==se.branchName) return false; }
    if(f.q){ const s=f.q.toLowerCase(); if(!(r.trackingId.toLowerCase().includes(s)||(r.citizenName||'').includes(f.q)||(r.phone||'').includes(f.q)||(r.description||'').includes(f.q)||(r.targetEntity||'').includes(f.q))) return false; }
    if(f.status!=='الكل'&&r.status!==f.status)return false;
    if(f.gov!=='الكل'&&r.governorate!==f.gov)return false;
    if(f.type!=='الكل'&&r.requestType!==f.type)return false;
    if(f.urgency!=='الكل'&&r.urgency!==f.urgency)return false;
    if(f.office!=='الكل'&&(r.office||'(بلا مكتب)')!==f.office)return false;
    return true;
  });
}

function setMode(m){
  if(m==='office' && !state.session){ openLogin(); return; }
  state.mode=m; state.tab = m==='office'?'secretary-quick':'citizen-portal'; render();
}
function setTab(t){ state.tab=t; render(); }
function setStatus(s){ state.filters.status=s; renderBody(); }
function resetFilters(){ state.filters={q:'',gov:'الكل',type:'الكل',office:'الكل',urgency:'الكل',status:'الكل'}; renderBody(); }
function sortList(by){
  if(by==='urgency'){ const o={'عاجل':0,'عالٍ':1,'متوسط':2,'اعتيادي':3}; state.requests.sort((a,b)=>(o[a.urgency]??9)-(o[b.urgency]??9)); }
  else if(by==='date'){ state.requests.sort((a,b)=>(b.submittedAt||'').localeCompare(a.submittedAt||'')); }
  else if(by==='status'){ state.requests.sort((a,b)=>STATUSES.indexOf(a.status)-STATUSES.indexOf(b.status)); }
  renderBody(); toast('تم ترتيب القائمة');
}
function logout(){ state.session=null; localStorage.removeItem('naib_session'); state.mode='citizen'; state.tab='citizen-portal'; render(); }

async function doLogin(){
  const user=($('#lgUser').value||'').trim(); const pass=$('#lgPass').value;
  if(!user){ toast('ادخل اسم المستخدم', false); return; }
  const ph=await hashPass(pass);
  // 1) حساب المدير العام (المبرمج/الإدارة)
  const adminUser=state.settings.adminUser||'admin';
  const adminOk = user.toLowerCase()===adminUser.toLowerCase() && ( (state.settings.adminPassHash && ph===state.settings.adminPassHash) || (!state.settings.adminPassHash && pass===(state.settings.staffPass||'123456')) );
  if(adminOk){
    state.session={ name:'المدير العام', user:adminUser, role:'رئيس المكتب', master:true, perms:roleDefaults('رئيس المكتب'), loginAt:nowStr() };
  } else {
    // 2) حسابات الموظفين (باسم المستخدم + كلمة المرور المجزّأة)
    const e=(state.settings.employees||[]).find(x=> (x.username||'').toLowerCase()===user.toLowerCase());
    const match = e && ( (e.passHash && ph===e.passHash) || (e.pass && pass===e.pass) );
    if(!match){ toast('اسم المستخدم أو كلمة المرور غير صحيحة', false); return; }
    state.session={ name:e.name, user:e.username, role:e.role, branchName:e.branchName||'', phone:e.phone||'', perms:e.perms||roleDefaults(e.role), master:false, loginAt:nowStr() };
  }
  localStorage.setItem('naib_session', JSON.stringify(state.session));
  closeModal(); state.mode='office'; state.tab='secretary-quick'; render(); toast('مرحباً '+state.session.name+(state.session.branchName?(' — '+state.session.branchName):''));
}

function exportLedger(){
  if(state.session && !can('export')){ toast('لا تملك صلاحية التصدير', false); return; }
  const list=filtered();
  const cols=['رمز المتابعة','تاريخ الاستلام','الاسم الرباعي','الهاتف','المحافظة','القضاء/الحي','نوع الطلب','الجهة المعنية','الطلب','فرد/مجموعة','المستند','الحالة','الأولوية','المكتب/الفرع','موظف الاستقبال','القناة','رقم الوارد','رقم الصادر','آخر تحديث'];
  const rows=list.map(r=>[r.trackingId,r.submittedAt,r.citizenName,r.phone,r.governorate,r.district,r.requestType,r.targetEntity,(r.description||'').replace(/\n/g,' '),r.scope,r.documentState,r.status,r.urgency,r.office,r.receptionEmployee,r.channel,r.registryIn,r.registryOut,r.updatedAt]);
  const esc=v=>{ v=String(v==null?'':v); return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; };
  const csv='﻿'+[cols.join(',')].concat(rows.map(r=>r.map(esc).join(','))).join('\n');
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8'}); const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download='سجل_الطلبات_'+nowStr().replace(/[: ]/g,'-')+'.csv'; a.click(); URL.revokeObjectURL(url);
  toast('تم تصدير '+list.length+' طلب إلى إكسل (CSV)');
}

const ENTITY_NORMALIZE=[
  [/الترب?ي?ه|ترب?يه|وزار[ةه] الترب?ي?[ةه]/,'وزارة التربية'],
  [/العمل|الرعاي[ةه]|الحماي[ةه] الاجتماعي[ةه]/,'وزارة العمل والشؤون الاجتماعية'],

  [/الصح[ةه]|صحه/,'وزارة الصحة'],
  [/المالي[ةه]|التقاعد/,'وزارة المالية'],
  [/الما[ءه]|الموارد المائي[ةه]/,'وزارة الموارد المائية'],
  [/الكهرب/,'وزارة الكهرباء'],
  [/النفط/,'وزارة النفط'],
  [/الداخلي[ةه]/,'وزارة الداخلية'],
  [/الدفاع/,'وزارة الدفاع'],

function normalizeEntity(txt){ const s=String(txt||'').trim(); if(!s)return s; for(const[re,canon]of ENTITY_NORMALIZE){ if(re.test(s))return canon; } return s; }

function isWelfare(type){ return /رعاية|الرعاية الاجتماعية|راتب أو تقاعد أو رعاية/.test(type||''); }

  const wf=isWelfare(t.value); const mr=$('#nMotherReq'); if(mr){ mr.style.display=wf?'':'none'; } const mw=$('#nMotherWrap'); if(mw){ mw.style.outline=wf?'2px solid var(--am-400)':''; mw.style.borderRadius='8px'; }

function renderAttChips(){ const c=$('#attChips'); if(!c)return; const a=window.__att||[]; c.innerHTML=a.map((f,i)=>`<span class="chip st-done" style="padding:5px 9px">${esc(f.name.slice(0,22))} <button type="button" class="x" style="padding:0 2px" onclick="window.__att.splice(${i},1);renderAttChips()">${icon('x')}</button></span>`).join(''); }
function addAttachments(files){
  window.__att=window.__att||[];
  [...files].slice(0,8).forEach(file=>{
    if(file.type.startsWith('image/')){
      const img=new Image(); const rd=new FileReader();
      rd.onload=()=>{ img.onload=()=>{ const sc=Math.min(1,1280/Math.max(img.width,img.height)); const cv=document.createElement('canvas'); cv.width=img.width*sc; cv.height=img.height*sc; cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height); const url=cv.toDataURL('image/jpeg',0.72); window.__att.push({name:file.name,type:'image/jpeg',dataUrl:url}); renderAttChips(); }; img.src=rd.result; };
      rd.readAsDataURL(file);
    } else {
      if(file.size>3*1024*1024){ toast('ملف PDF كبير (أكثر من 3MB): '+file.name,false); return; }
      const rd=new FileReader(); rd.onload=()=>{ window.__att.push({name:file.name,type:file.type||'application/pdf',dataUrl:rd.result}); renderAttChips(); }; rd.readAsDataURL(file);
    }
  });
}

      <div class="field"><label>رسالة واتساب التأكيدية (يمكن تعديلها قبل الإرسال)</label><textarea id="confirmWa" rows="8" style="line-height:1.8">${esc(msg)}</textarea></div>

      <div class="scan-frame"><video id="scanVid" class="scan-video" playsinline muted></video><div class="scan-line"></div></div>

    </div>`,'480px');

async function startScan(){
  const vid=$('#scanVid'); const msg=$('#scanMsg');
  if(!('BarcodeDetector' in window)){ msg.innerHTML='<span class="chip urg-mid" style="padding:6px">متصفحك لا يدعم المسح التلقائي — استخدم الإدخال اليدوي أو متصفح Chrome على الهاتف</span>'; }
  try{
    scanStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
    vid.srcObject=scanStream; await vid.play();
    if('BarcodeDetector' in window){
      const det=new BarcodeDetector({formats:['code_128','qr_code','ean_13','code_39']});
      const tick=async()=>{ if(!scanStream)return; try{ const codes=await det.detect(vid); if(codes.length){ stopScan(); scanOpen(codes[0].rawValue); return; } }catch(e){} scanRAF=requestAnimationFrame(tick); };
      scanRAF=requestAnimationFrame(tick);
    }
  }catch(e){ msg.innerHTML='<span class="chip urg-high" style="padding:6px">تعذّر الوصول للكاميرا: '+esc(e.message)+'</span>'; }
}
function stopScan(){ if(scanRAF)cancelAnimationFrame(scanRAF); scanRAF=null; if(scanStream){ scanStream.getTracks().forEach(t=>t.stop()); scanStream=null; } }
function scanOpen(code){
  stopScan(); const r=Store.byTracking((code||'').trim()); closeModal();
  if(!r){ toast('لم يتم العثور على معاملة: '+code, false); return; }
  if(state.mode==='office'){ openDetail(r.id); } else { state.mode='citizen'; render(); setTimeout(()=>{ const i=$('#trackInput'); if(i){i.value=r.trackingId; doTrack();} },50); }
}

  s.staffPass=$('#setPass').value||'123456';
  if(s.gasUrl) GAS.pushMeta();
  s.aiProvider=$('#setProvider').value;
  s.geminiKey=$('#setGemKey').value.trim(); s.geminiModel=$('#setGemModel').value.trim()||'gemini-flash-latest';
  s.claudeKey=$('#setClKey').value.trim(); s.claudeModel=$('#setClModel').value.trim()||'claude-sonnet-4-5';
  saveSettings(); closeModal(); render(); toast('تم حفظ الإعدادات');
}

/* ------------------------------- الإشعارات ------------------------------- */
function openNotifications(){
  const over=state.requests.filter(r=>slaInfo(r.submittedAt,r.status).isOverdue);
  openModal(`<div class="modal-h" style="justify-content:space-between"><div class="b">${icon('bell')} إشعارات المهل القانونية (7 أيام)</div><button class="x" onclick="closeModal()">${icon('x')}</button></div>
    <div class="modal-b"><div class="flex col gap2">${over.length?over.map(r=>`<div class="req-row flex items-center justify-between gap2"><div><div class="b txt-sm">${esc(r.citizenName)}</div><div class="txt-xs muted">${esc(r.trackingId)} · منذ ${slaInfo(r.submittedAt,r.status).days} يوم</div></div><button class="btn btn-em btn-sm" onclick="closeModal();state.mode='office';openDetail('${r.id}')">متابعة</button></div>`).join(''):'<div class="center muted pad5">لا توجد معاملات متجاوزة للمهلة ✅</div>'}</div></div>`,'480px');
}

/* ---------------------- الفرز الذكي + المساعد الذكي ---------------------- */
async function runAiFilter(){
  const q=$('#aiFilterInput').value.trim(); if(!q)return;
  const note=$('#aiFilterNote');
  if(!AI.ready()){ // فرز محلي بسيط بالكلمات المفتاحية
    applyLocalSmartFilter(q); note.innerHTML=`<div class="txt-xs muted mt2">تم الفرز محلياً (بدون ذكاء اصطناعي). فعّل مفتاح API من الإعدادات لفرز أدق.</div>`; return; }
  note.innerHTML=`<div class="txt-xs em mt2 pulse">جارِ الفرز بالذكاء الاصطناعي...</div>`;
  try{
    const out=await AI.ask([{role:'user',content:'نفّذ هذا الفرز على المعاملات وأعد كتلة <ACT> فقط مع شرح موجز: '+q}]);
    const {text,actions}=AI.parseActions(out); executeActions(actions); note.innerHTML=`<div class="txt-xs muted mt2">${esc(text||'تم تطبيق الفرز')}</div>`;
  }catch(e){ note.innerHTML=`<div class="txt-xs urg-high mt2">تعذّر: ${esc(e.message)}</div>`; }
}
function applyLocalSmartFilter(q){
  resetFilters();
  GOVS.forEach(g=>{ if(q.includes(g)) state.filters.gov=g; });
  REQUEST_TYPES.forEach(t=>{ if(q.includes(t)) state.filters.type=t; });
  URGENCIES.forEach(u=>{ if(q.includes(u)) state.filters.urgency=u; });
  if(/عاجل/.test(q)) state.filters.urgency='عاجل';
  STATUSES.forEach(s=>{ if(q.includes(s)) state.filters.status=s; });
  renderBody();
}
function executeActions(actions){
  if(!actions||!actions.length)return;
  actions.forEach(a=>{
    if(a.type==='filter'){ resetFilters(); if(a.status)state.filters.status=a.status; if(a.governorate)state.filters.gov=a.governorate; if(a.urgency)state.filters.urgency=a.urgency; if(a.requestType)state.filters.type=a.requestType; if(a.q)state.filters.q=a.q; if(state.mode==='office'&&state.tab!=='dashboard'){state.tab='dashboard';render();} else renderBody(); }
    else if(a.type==='sort'){ sortList(a.by==='date'?'date':a.by==='status'?'status':'urgency'); }
    else if(a.type==='open'){ const r=Store.byTracking(a.trackingId); if(r)openDetail(r.id); }
    else if(a.type==='goto'){ state.tab=a.tab; render(); }
    else if(a.type==='draft_whatsapp'){ const r=Store.byTracking(a.trackingId); if(r)openWhatsApp(r.id); }
    else if(a.type==='draft_letter'){ const r=Store.byTracking(a.trackingId); if(r)openLetter(r.id); }
    else if(a.type==='audit'){ const r=Store.byTracking(a.trackingId); if(r)openDetail(r.id); }
  });
}
function toggleAI(){ state.ai.open=!state.ai.open; renderAIPanel(); }
function renderAIPanel(){
  const root=$('#aiPanel'); if(!root)return;
  if(!state.ai.open){ root.innerHTML=''; return; }
  const msgs=state.ai.messages.map(m=>`<div class="bubble ${m.role==='user'?'u':'a'}">${esc(m.content)}</div>`).join('');
  root.innerHTML=`<div class="ai-panel">
    <div class="ai-head"><div class="flex items-center gap2 b">${icon('sparkle')} المساعد الذكي <span class="chip ${AI.ready()?'st-done':'urg-low'}" style="font-size:10px;padding:2px 7px">${AI.ready()?'متصل':'غير مُفعّل'}</span></div><button class="x" style="color:#a7f3d0" onclick="toggleAI()">${icon('x')}</button></div>
    <div class="ai-msgs" id="aiMsgs">${msgs||`<div class="bubble a">مرحباً 👋 أنا مساعد الإدارة. اسألني عن المعاملات، أو اطلب مني الفرز والترتيب وفتح معاملة أو صياغة كتاب أو رسالة واتساب. مثال: "أظهر الحالات العاجلة في بغداد" أو "افتح المعاملة IQ-2026-4891".</div>`}${state.ai.busy?'<div class="bubble a pulse">...يكتب</div>':''}</div>
    <div class="ai-in"><input id="aiInput" placeholder="${AI.ready()?'اكتب سؤالك أو أمرك...':'فعّل مفتاح API من الإعدادات أولاً'}" onkeydown="if(event.key==='Enter')aiSend()"><button class="btn btn-em" onclick="aiSend()">${icon('send')}</button></div>
  </div>`;
  const m=$('#aiMsgs'); if(m)m.scrollTop=m.scrollHeight;
}
async function aiSend(){
  const inp=$('#aiInput'); if(!inp)return; const q=inp.value.trim(); if(!q)return;
  if(!AI.ready()){ toast('فعّل مفتاح الذكاء الاصطناعي من الإعدادات', false); openSettings(); return; }
  state.ai.messages.push({role:'user',content:q}); state.ai.busy=true; renderAIPanel();
  try{
    const out=await AI.ask(state.ai.messages);
    const {text,actions}=AI.parseActions(out);
    state.ai.messages.push({role:'assistant',content:text||'تم.'}); state.ai.busy=false; renderAIPanel();
    if(actions&&actions.length){ executeActions(actions); }
  }catch(e){ state.ai.busy=false; state.ai.messages.push({role:'assistant',content:'تعذّر الاتصال: '+e.message}); renderAIPanel(); }
}

/* ---------------------------------- الإقلاع ---------------------------------- */
window.addEventListener('online',()=>{ state.online=true; render(); GAS.push(); });
window.addEventListener('offline',()=>{ state.online=false; render(); });
async function boot(){
  const h = location.hash || '';
  // الصفحة العامة للمواطن (بلا دخول/ترخيص) — تجلب الهوية والتعليمات من السحابة
  if(/#submit/.test(h)){
    state.public=true; state.requests=[];
    const m=h.match(/[#&]db=([^&]+)/); if(m){ try{ state.settings.gasUrl=decodeURIComponent(m[1]); }catch(e){} }
    $('#app').innerHTML='<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;color:#64748b">… جارِ التحميل …</div>';
    if(state.settings.gasUrl && state.online){ try{ await GAS.pullMeta(); }catch(e){} }
    renderPublicPage(); return;
  }
  Store.load();
  // تفعيل تلقائي عند فتح رابط #go=
  if(/[#&]go=/.test(h) || /NBL1\./.test(h)){
    try{ await LIC.activate(h); history.replaceState(null,'', location.pathname+location.search); }catch(e){ /* يظهر في شاشة التفعيل */ }
  }
  let ev = await LIC.evaluate();
  // عند الإقلاع والاتصال متاح: جرّب تحقق الخادم إن كان الترخيص بحاجة تجديد أو موقوفاً
  if(ev.state!=='active' && ev.state!=='grace' && LIC.stored() && state.online){
    try{ const r=await LIC.refresh(true); if(r) ev=r; }catch(e){}
  }
  if(ev.state!=='active' && ev.state!=='grace'){ renderActivation(ev); return; }
  render();
  if(ev.state==='grace'){ toast('الترخيص يعمل ضمن مهلة السماح ('+(ev.graceLeft||'')+' يوم) — اتصل بالإنترنت للتجديد', false); }
  // تحقق دوري كل 6 ساعات في الخلفية
  if(state.online){ LIC.refresh(false).then(r=>{ if(r && r.state!=='active' && r.state!=='grace') renderActivation(r); }); }
  if(state.settings.gasUrl && state.online){ GAS.pullStaff(); GAS.pull().then(r=>{ if(r.ok) render(); }); }
}
boot();

</script>
